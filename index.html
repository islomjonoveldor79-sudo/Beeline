<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beeline Diler Kalkulyatori</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #f4f5f7;
      --card-bg: #ffffff;
      --text-color: #1c1c1e;
      --accent-color: #ffcc00; /* Beeline sariq */
      --btn-bg: #e5e5ea;
      --border-radius: 14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      padding-bottom: 220px; /* Pastki hisob-kitob oynasi to'sib qo'ymasligi uchun */
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 20px;
    }

    .tariff-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tariff-card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .tariff-info {
      display: flex;
      flex-direction: column;
    }

    .tariff-name {
      font-weight: 700;
      font-size: 16px;
    }

    .tariff-bonus {
      font-size: 13px;
      color: #8e8e93;
      margin-top: 4px;
    }

    .counter-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-counter {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background-color: var(--btn-bg);
      font-size: 20px;
      font-weight: bold;
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }

    .btn-counter:active {
      background-color: var(--accent-color);
    }

    .count-input {
      width: 48px;
      height: 36px;
      text-align: center;
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      outline: none;
    }

    /* Pastki yopishqoq hisob-kitob paneli */
    .summary-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
      padding: 16px;
      z-index: 100;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .summary-row.total {
      font-size: 16px;
      font-weight: bold;
      border-top: 1px solid #e5e5ea;
      padding-top: 8px;
      margin-top: 8px;
    }

    .rms-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .rms-card {
      background-color: #f9f9fb;
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      border: 1px solid #e5e5ea;
    }

    .rms-card .title {
      font-size: 11px;
      color: #8e8e93;
      font-weight: 600;
    }

    .rms-card .value {
      font-size: 13px;
      font-weight: 700;
      color: #34c759;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <h2>Tariflar va Sotuvlar</h2>

  <div class="tariff-list" id="tariffList"></div>

  <div class="summary-panel">
    <div class="summary-row">
      <span>Jami sotilgan SIM-kartalar:</span>
      <span id="totalSimsCount">0 dona</span>
    </div>
    <div class="summary-row total">
      <span>Boshlang'ich bonus (100%):</span>
      <span id="baseBonusAmount">0 so'm</span>
    </div>

    <div class="rms-grid">
      <div class="rms-card">
        <div class="title">+10% RMS</div>
        <div class="value" id="rms10Amount">0 so'm</div>
      </div>
      <div class="rms-card">
        <div class="title">+20% RMS</div>
        <div class="value" id="rms20Amount">0 so me</div>
      </div>
      <div class="rms-card">
        <div class="title">+30% RMS</div>
        <div class="value" id="rms30Amount">0 so'm</div>
      </div>
    </div>
  </div>

  <script>
    // 1. Tariflar bazasi (Har bir tarif va 1 ta SIM uchun beriladigan bonus summasi)
    const tariffs = [
      { id: 1, name: "YANA 30", bonusPerSim: 25500 },
      { id: 2, name: "YANA 40", bonusPerSim: 34000 },
      { id: 3, name: "YANA 50", bonusPerSim: 42500 },
      { id: 4, name: "STATUS SILVER", bonusPerSim: 65000 },
      { id: 5, name: "STATUS GOLD", bonusPerSim: 90000 }
    ];

    // Har bir tarif sotuv sonini saqlovchi obyekt
    const salesData = {};
    tariffs.forEach(t => salesData[t.id] = 0);

    // 2. Interfeysni shakllantirish
    function renderTariffs() {
      const container = document.getElementById('tariffList');
      container.innerHTML = '';

      tariffs.forEach(tariff => {
        const card = document.createElement('div');
        card.className = 'tariff-card';
        card.innerHTML = `
          <div class="tariff-info">
            <span class="tariff-name">${tariff.name}</span>
            <span class="tariff-bonus">1 SIM: ${tariff.bonusPerSim.toLocaleString()} so'm</span>
          </div>
          <div class="counter-control">
            <button class="btn-counter" onclick="updateCount(${tariff.id}, -1)">-</button>
            <input type="number" class="count-input" id="input-${tariff.id}" value="${salesData[tariff.id]}" min="0" onchange="setCount(${tariff.id}, this.value)">
            <button class="btn-counter" onclick="updateCount(${tariff.id}, 1)">+</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 3. Hisoblagich tugmalari bosilganda
    function updateCount(tariffId, delta) {
      const current = salesData[tariffId] || 0;
      const updated = Math.max(0, current + delta);
      salesData[tariffId] = updated;
      document.getElementById(`input-${tariffId}`).value = updated;
      calculateTotals();
    }

    // Direct input orqali raqam yozilganda (masalan, 100 kiritilganda)
    function setCount(tariffId, value) {
      const val = parseInt(value) || 0;
      salesData[tariffId] = Math.max(0, val);
      document.getElementById(`input-${tariffId}`).value = salesData[tariffId];
      calculateTotals();
    }

    // 4. Avtomatik qayta hisoblash formulasi
    function calculateTotals() {
      let totalSims = 0;
      let baseBonus = 0;

      tariffs.forEach(tariff => {
        const count = salesData[tariff.id] || 0;
        totalSims += count;
        baseBonus += count * tariff.bonusPerSim;
      });

      // RMS Ustamalarini hisoblash
      const rms10 = baseBonus * 1.10;
      const rms20 = baseBonus * 1.20;
      const rms30 = baseBonus * 1.30;

      // Ekranga chiqarish
      document.getElementById('totalSimsCount').innerText = totalSims.toLocaleString() + " dona";
      document.getElementById('baseBonusAmount').innerText = Math.round(baseBonus).toLocaleString() + " so'm";
      document.getElementById('rms10Amount').innerText = Math.round(rms10).toLocaleString() + " so'm";
      document.getElementById('rms20Amount').innerText = Math.round(rms20).toLocaleString() + " so'm";
      document.getElementById('rms30Amount').innerText = Math.round(rms30).toLocaleString() + " so'm";
    }

    // Telegram WebApp sozlamalari
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Dastlabki ishga tushirish
    renderTariffs();
    calculateTotals();
  </script>
</body>
</html>
