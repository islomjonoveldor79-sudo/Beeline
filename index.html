<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beeline Diler Kalkulyatori</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Beeline brend ranglari */
        .bg-beeline { background-color: #FFCC00; }
        .text-beeline { color: #FFCC00; }
        .border-beeline { border-color: #FFCC00; }
        body { background-color: #f3f4f6; }
        
        /* Telegram Web App standartiga mos mobil ko'rinish */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="app-container flex flex-col">
    <div class="bg-black text-white p-4 text-center rounded-b-2xl shadow-md">
        <h1 class="text-xl font-bold text-beeline">Beeline Aqlli Kalkulyator</h1>
        <p class="text-xs text-gray-300 mt-1">Dilerlar uchun tezkor yordamchi</p>
    </div>

    <div class="p-4 flex-grow">
        
        <div class="flex space-x-2 mb-4 bg-gray-100 p-1 rounded-lg">
            <button onclick="switchTab('calculator')" id="tab-calc" class="flex-1 py-2 text-sm font-semibold rounded-md bg-white shadow text-black">Hisob-kitob</button>
            <button onclick="switchTab('budget')" id="tab-budget" class="flex-1 py-2 text-sm font-semibold rounded-md text-gray-500">Byudjet qidiruvi</button>
        </div>

        <div id="calculator-section">
            <label class="block text-sm font-bold text-gray-700 mb-2">Tarifni tanlang:</label>
            <select id="tariff-select" class="w-full border-2 border-gray-300 rounded-lg p-3 bg-white text-lg font-semibold focus:outline-none focus:border-beeline" onchange="calculate()">
                </select>

            <div class="mt-4 flex items-center justify-between">
                <label class="text-sm font-bold text-gray-700">Miqdori (nechta ulanmoqda?):</label>
                <input type="number" id="quantity" value="1" min="1" class="w-20 border-2 border-gray-300 rounded-lg p-2 text-center font-bold text-lg focus:outline-none focus:border-beeline" oninput="calculate()">
            </div>

            <div class="mt-6 bg-black text-white rounded-2xl p-5 shadow-lg relative overflow-hidden">
                <div class="absolute top-0 right-0 w-16 h-16 bg-beeline rounded-bl-full opacity-20"></div>
                
                <h2 class="text-center text-sm text-gray-400 mb-1">Umumiy mijoz to'lashi kerak (Итого):</h2>
                <div id="result-total" class="text-center text-4xl font-black text-beeline mb-4">0 so'm</div>
                
                <div class="flex justify-between border-t border-gray-700 pt-3">
                    <div class="text-center">
                        <p class="text-xs text-gray-400">1-oylik to'lov</p>
                        <p id="result-month" class="font-bold text-lg">0 so'm</p>
                    </div>
                    <div class="text-center">
                        <p class="text-xs text-gray-400">Kopilka (Bonus)</p>
                        <p id="result-kopilka" class="font-bold text-lg">0 so'm</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="budget-section" class="hidden">
            <div class="bg-beeline bg-opacity-20 p-4 rounded-xl mb-4 border border-beeline">
                <label class="block text-sm font-bold text-black mb-2">Mijozda qancha pul bor? (so'm)</label>
                <input type="number" id="budget-input" placeholder="Masalan: 150000" class="w-full rounded-lg p-3 text-lg font-bold border-2 border-gray-300 focus:outline-none focus:border-black" oninput="findTariffs()">
            </div>
            
            <h3 class="text-sm font-bold text-gray-700 mb-2">Mos keluvchi tariflar:</h3>
            <div id="budget-results" class="space-y-3">
                <p class="text-gray-500 text-sm italic">Mablag'ni kiriting, tizim avtomatik tarif tavsiya qiladi.</p>
            </div>
        </div>

    </div>
    
    <div class="p-4 bg-white border-t">
        <button class="w-full bg-beeline hover:bg-yellow-500 text-black font-bold text-lg py-3 rounded-xl transition duration-200 shadow-md">
            Sotuvni tasdiqlash
        </button>
    </div>
</div>

<script>
    // Jadvaldan olingan tariflar bazasi (JSON arxitekturasi)
    const tariffs = [
        { name: "Oddiy", first_month: 10000, kopilka: 0, total: 10000 },
        { name: "Standart", first_month: 4500, kopilka: 9000, total: 13500 },
        { name: "Optimal", first_month: 5500, kopilka: 11000, total: 16500 },
        { name: "Hello 1", first_month: 6000, kopilka: 12000, total: 18000 },
        { name: "Yorqin", first_month: 31500, kopilka: 70000, total: 101500 },
        { name: "Vibe", first_month: 36000, kopilka: 79000, total: 115000 },
        { name: "Hello 2", first_month: 40000, kopilka: 87000, total: 127000 },
        { name: "Oila Max", first_month: 45000, kopilka: 105000, total: 150000 },
        { name: "Status Silver", first_month: 49500, kopilka: 114000, total: 163500 },
        { name: "Status Gold", first_month: 67500, kopilka: 155000, total: 222500 },
        { name: "Oila Ultra", first_month: 75000, kopilka: 170000, total: 245000 },
        { name: "Oila Mega", first_month: 90000, kopilka: 200000, total: 290000 },
        { name: "Status Platinum", first_month: 90000, kopilka: 200000, total: 290000 }
    ];

    // Pul formatini chiroyli qilish (1 000 000)
    function formatMoney(amount) {
        return amount.toLocaleString('ru-RU');
    }

    // Sahifa yuklanganda tariflarni Select'ga qo'shish
    window.onload = function() {
        const select = document.getElementById('tariff-select');
        tariffs.forEach((t, index) => {
            let option = document.createElement('option');
            option.value = index;
            option.text = t.name + " (" + formatMoney(t.total) + " so'm)";
            select.appendChild(option);
        });
        calculate(); // Boshlang'ich hisob-kitobni chiqarish
    };

    // Asosiy hisob-kitob funksiyasi
    function calculate() {
        const selectedIndex = document.getElementById('tariff-select').value;
        const qty = parseInt(document.getElementById('quantity').value) || 1;
        
        const tariff = tariffs[selectedIndex];
        
        const totalSum = tariff.total * qty;
        const monthSum = tariff.first_month * qty;
        const kopilkaSum = tariff.kopilka * qty;

        // Ekranga chiqarish
        document.getElementById('result-total').innerText = formatMoney(totalSum) + " so'm";
        document.getElementById('result-month').innerText = formatMoney(monthSum) + " so'm";
        document.getElementById('result-kopilka').innerText = formatMoney(kopilkaSum) + " so'm";
    }

    // Byudjet bo'yicha qidiruv (Teskari hisob-kitob)
    function findTariffs() {
        const budget = parseInt(document.getElementById('budget-input').value);
        const resultsDiv = document.getElementById('budget-results');
        resultsDiv.innerHTML = ''; // Tozalash

        if (!budget || budget < 10000) {
            resultsDiv.innerHTML = '<p class="text-gray-500 text-sm italic">Mablag\'ni kiriting...</p>';
            return;
        }

        // Byudjetga mos keladigan tariflarni filtrlash (Puli yetadigan eng zo'r tariflar)
        const suitableTariffs = tariffs.filter(t => t.total <= budget).reverse();

        if (suitableTariffs.length === 0) {
            resultsDiv.innerHTML = '<p class="text-red-500 text-sm font-bold">Bu summaga mos tarif topilmadi.</p>';
            return;
        }

        // Topilgan tariflarni kartochka shaklida chiqarish
        suitableTariffs.forEach(t => {
            // Qaytimni hisoblash
            const change = budget - t.total;
            
            const card = `
                <div class="bg-white border-2 border-gray-200 rounded-xl p-3 flex justify-between items-center shadow-sm">
                    <div>
                        <h4 class="font-bold text-black text-lg">${t.name}</h4>
                        <p class="text-xs text-gray-500">1-oy: ${formatMoney(t.first_month)} | Kopilka: ${formatMoney(t.kopilka)}</p>
                        ${change > 0 ? `<p class="text-xs text-green-600 font-bold mt-1">Qaytim: ${formatMoney(change)} so'm</p>` : ''}
                    </div>
                    <div class="bg-black text-beeline font-bold px-3 py-2 rounded-lg text-sm">
                        ${formatMoney(t.total)}
                    </div>
                </div>
            `;
            resultsDiv.innerHTML += card;
        });
    }

    // Tablarni o'zgartirish (Hisob-kitob <-> Byudjet)
    function switchTab(tab) {
        const calcSec = document.getElementById('calculator-section');
        const budgSec = document.getElementById('budget-section');
        const calcTabBtn = document.getElementById('tab-calc');
        const budgTabBtn = document.getElementById('tab-budget');

        if (tab === 'calculator') {
            calcSec.style.display = 'block';
            budgSec.style.display = 'none';
            
            calcTabBtn.classList.replace('text-gray-500', 'text-black');
            calcTabBtn.classList.replace('bg-transparent', 'bg-white');
            calcTabBtn.classList.add('shadow');
            
            budgTabBtn.classList.replace('text-black', 'text-gray-500');
            budgTabBtn.classList.replace('bg-white', 'bg-transparent');
            budgTabBtn.classList.remove('shadow');
        } else {
            calcSec.style.display = 'none';
            budgSec.style.display = 'block';
            
            budgTabBtn.classList.replace('text-gray-500', 'text-black');
            budgTabBtn.classList.replace('bg-transparent', 'bg-white');
            budgTabBtn.classList.add('shadow');
            
            calcTabBtn.classList.replace('text-black', 'text-gray-500');
            calcTabBtn.classList.replace('bg-white', 'bg-transparent');
            calcTabBtn.classList.remove('shadow');
        }
    }
</script>

</body>
</html>
